[project]
name = "nexo-ai"
version = "0.1.0"
description = "Uma plataforma inteligente que transforma informações dispersas em conhecimento acessível, ajudando pessoas e equipes a encontrar respostas, compreender decisões e consultar fontes confiáveis."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20,<2",
    "fastapi>=0.143,<0.144",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.1.4,<2.2",
    "structlog>=24.4,<26",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1,<3",
    "mypy>=1.15,<2",
    "pip-audit>=2.9,<3",
    "pre-commit>=4,<5",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexo_ai"]

[tool.uv]
package = true
required-version = ">=0.13.0"

[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "--cov=nexo_ai",
    "--cov-report=term-missing",
]
markers = [
    "integration: tests that require a local PostgreSQL database with pgvector",
]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["nexo_ai"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S104", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["nexo_ai", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
mypy_path = ["src"]
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
